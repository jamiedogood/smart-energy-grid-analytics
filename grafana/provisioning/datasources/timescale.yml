apiVersion: 1
datasources:
  - name: SmartGrid TimescaleDB
    uid: smartgrid-pg
    type: grafana-postgresql-datasource
    url: timescaledb:5432
    user: postgres
    isDefault: true
    jsonData:
      database: smartgrid
      sslmode: disable
      timescaledb: true
    secureJsonData:
      password: $PG_PASSWORD